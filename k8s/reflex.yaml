apiVersion: v1
kind: ServiceAccount
metadata:
  name: reflex-sa
  namespace: default
---
# Scoped deliberately.
#
# This was apiGroups/resources/verbs: ["*"], which is cluster-admin for a
# process whose whole purpose is to execute LLM-generated Wasm. These are the
# only permissions the code actually exercises:
#   - DAG checkpointing and orphan adoption  -> configmaps
#   - leader election                        -> leases
#   - K8s context enrichment for the LLM     -> pods, pods/log, events
#   - rollout restart remediation            -> apps/deployments (patch)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: reflex-cluster-role
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list"]
- apiGroups: ["apps"]
  resources: ["deployments", "deployments/scale"]
  verbs: ["get", "list", "watch", "patch", "update"]
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: reflex-cluster-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: reflex-cluster-role
subjects:
- kind: ServiceAccount
  name: reflex-sa
  namespace: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reflex
  namespace: default
  labels:
    app: reflex
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reflex
  template:
    metadata:
      labels:
        app: reflex
    spec:
      serviceAccountName: reflex-sa
      containers:
      - name: reflex
        image: localhost/reflex:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
          name: webhook
        - containerPort: 9090
          name: wasm
        env:
        - name: ROUTING_MIN_CONFIDENCE
          value: "0.60"
        - name: ROUTING_MAX_SEVERITY
          value: "8.0"
        - name: ROUTING_MIN_RECOVERABLE
          value: "0.60"
        - name: OLLAMA_HOST
          value: "http://172.25.81.153:11435"
        - name: AI_API_ENDPOINT
          value: "http://172.25.81.153:11435/api/generate"
        - name: REFLEX_POLICY_PATH
          value: "/app/policy.rego"
        - name: REFLEX_ENV
          value: "production"
---
apiVersion: v1
kind: Service
metadata:
  name: reflex
  namespace: default
spec:
  selector:
    app: reflex
  ports:
  - name: webhook
    port: 8080
    targetPort: 8080
  - name: wasm
    port: 9090
    targetPort: 9090
