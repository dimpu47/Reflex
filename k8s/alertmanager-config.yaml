apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: reflex-config
  labels:
    release: prometheus
spec:
  route:
    groupBy: ['alertname']
    groupWait: 10s
    groupInterval: 1m
    repeatInterval: 1h
    receiver: 'reflex-webhook'
  receivers:
  - name: 'reflex-webhook'
    webhookConfigs:
    - url: 'http://reflex.default.svc:8080/webhook'
      sendResolved: true
