<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reflex HITL Dashboard</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.7);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-blue: #3b82f6;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: linear-gradient(135deg, #020617 0%, var(--bg-dark) 100%);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        header {
            padding: 1.5rem 3rem;
            border-bottom: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            background: linear-gradient(90deg, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .container {
            max-width: 1200px;
            margin: 3rem auto;
            padding: 0 2rem;
        }

        .dashboard-header {
            margin-bottom: 2rem;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background: var(--panel-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 1.5rem;
            backdrop-filter: blur(12px);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            animation: fadeIn 0.4s ease-out;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
        }

        .alert-id {
            font-family: monospace;
            color: var(--accent-blue);
            background: rgba(59, 130, 246, 0.1);
            padding: 0.25rem 0.5rem;
            border-radius: 6px;
            font-size: 0.85rem;
        }

        .card-title {
            margin: 0;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .card-body {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }

        .actions {
            display: flex;
            gap: 1rem;
        }

        button {
            flex: 1;
            padding: 0.75rem;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .btn-approve {
            background: rgba(16, 185, 129, 0.1);
            color: var(--accent-green);
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .btn-approve:hover {
            background: var(--accent-green);
            color: white;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
        }

        .btn-deny {
            background: rgba(239, 68, 68, 0.1);
            color: var(--accent-red);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .btn-deny:hover {
            background: var(--accent-red);
            color: white;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
        }

        .empty-state {
            text-align: center;
            padding: 4rem;
            color: var(--text-secondary);
        }

        .loader {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            border-top-color: var(--accent-blue);
            animation: spin 1s ease-in-out infinite;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }
        
        .pulse {
            width: 8px;
            height: 8px;
            background: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent-green);
            animation: pulse 2s infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        /* Toast notifications */
        #toast-container {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            z-index: 50;
        }
        .toast {
            background: var(--panel-bg);
            border: 1px solid var(--glass-border);
            padding: 1rem 1.5rem;
            border-radius: 8px;
            backdrop-filter: blur(10px);
            animation: slideIn 0.3s ease-out forwards, fadeOut 0.5s ease-in forwards 3s;
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }
    </style>
</head>
<body>
    <header>
        <h1>Reflex Ops Center</h1>
        <div class="status-badge">
            <div class="pulse"></div>
            Live Polling
        </div>
    </header>

    <div class="container">
        <div class="dashboard-header">
            <h2 style="margin:0;">Pending Approvals</h2>
            <p style="color: var(--text-secondary); margin-top: 0.5rem;">Runbooks waiting for Human-in-the-Loop authorization.</p>
        </div>

        <div id="grid" class="card-grid">
            <div class="empty-state" style="grid-column: 1 / -1;">
                <div class="loader" style="margin-bottom: 1rem;"></div>
                <div>Fetching pending DAGs...</div>
            </div>
        </div>
    </div>

    <div id="toast-container"></div>

    <script>
        const grid = document.getElementById('grid');
        let knownIds = new Set();

        function showToast(message) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => {
                if (toast.parentNode) toast.parentNode.removeChild(toast);
            }, 3500);
        }

        async function handleAction(id, action) {
            try {
                const res = await fetch(`/${action}?id=${encodeURIComponent(id)}`, { method: 'POST' });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                showToast(`Successfully ${action}d alert ${id}`);
                poll(); // instant refresh
            } catch (err) {
                showToast(`Error: ${err.message}`);
            }
        }

        async function poll() {
            try {
                const res = await fetch('/pending');
                const alerts = await res.json();
                
                if (!alerts || alerts.length === 0) {
                    grid.innerHTML = `
                        <div class="empty-state" style="grid-column: 1 / -1;">
                            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.3; margin-bottom:1rem;">
                                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                                <polyline points="22 4 12 14.01 9 11.01"></polyline>
                            </svg>
                            <div>All systems normal. No pending approvals.</div>
                        </div>
                    `;
                    knownIds.clear();
                    return;
                }

                const currentIds = new Set(alerts);
                
                // Clear grid if we went from empty to having items
                if (grid.querySelector('.empty-state')) {
                    grid.innerHTML = '';
                }

                // Add new cards
                alerts.forEach(id => {
                    if (!document.getElementById(`card-${id}`)) {
                        const card = document.createElement('div');
                        card.id = `card-${id}`;
                        card.className = 'card';
                        card.innerHTML = `
                            <div class="card-header">
                                <h3 class="card-title">Runbook Pending</h3>
                                <span class="alert-id">${id}</span>
                            </div>
                            <div class="card-body">
                                This automated runbook execution requires human authorization to proceed in the production environment.
                            </div>
                            <div class="actions">
                                <button class="btn-approve" onclick="handleAction('${id}', 'approve')">✓ Approve</button>
                                <button class="btn-deny" onclick="handleAction('${id}', 'deny')">✕ Reject</button>
                            </div>
                        `;
                        grid.appendChild(card);
                    }
                });

                // Remove old cards
                knownIds.forEach(id => {
                    if (!currentIds.has(id)) {
                        const el = document.getElementById(`card-${id}`);
                        if (el) el.remove();
                    }
                });

                knownIds = currentIds;

            } catch (err) {
                console.error("Polling failed:", err);
            }
        }

        // Start polling every 2 seconds
        poll();
        setInterval(poll, 2000);
    </script>
</body>
</html>
